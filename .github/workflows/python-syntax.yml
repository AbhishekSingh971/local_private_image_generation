name: Python syntax check

on:
  push:
  pull_request:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile application, profile manager, GPU worker and trainer
        run: python -m py_compile app.py face_profiles.py studio_db.py gpu_worker.py train_face_lora.py image_generation.py training_generation.py pose_validation.py
      - name: Install lightweight test dependencies
        run: python -m pip install Pillow pytest SQLAlchemy numpy mediapipe==0.10.35 'psycopg[binary]>=3.2,<4'
      # test_studio_db.py still assumes SQLite, while the app intentionally requires Supabase/PostgreSQL.
      # Keep compatible unit suites in CI; database integration tests need a PostgreSQL test service.
      - name: Test compute routing, face profiles, image generation and pose targets
        run: python -m pytest -q tests/test_compute_routing.py tests/test_face_profiles.py tests/test_image_generation.py tests/test_training_generation.py tests/test_studio_js_controls.py
      - name: Check studio JavaScript syntax
        run: node --check static/studio.js
