name: Python syntax check

on:
  push:
  pull_request:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile application, profile manager, GPU worker and trainer
        run: python -m py_compile app.py face_profiles.py gpu_worker.py train_face_lora.py
      - name: Install lightweight profile test dependencies
        run: python -m pip install Pillow pytest
      - name: Test persistent face profile isolation
        run: python -m pytest -q tests/test_face_profiles.py
