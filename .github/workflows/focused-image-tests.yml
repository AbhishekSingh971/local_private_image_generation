name: Focused image-generation tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install focused test dependencies
        run: python -m pip install --upgrade pytest Pillow requests
      - name: Test scene policy and image-generation helpers
        run: >-
          python -m pytest -q
          tests/test_scene_validation.py
          tests/test_instruction_policy.py
          tests/test_image_generation.py
