name: CPU regression checks

on:
  push:
    branches:
      - main
      - feature/production-image-engine
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install test dependencies
        run: python -m pip install --upgrade pip -r requirements-dev.txt

      - name: Compile changed Python modules
        run: |
          python -m compileall -q app.py gpu_worker.py image_generation.py model_registry.py generation_contracts.py training_approval.py flux2_engine.py image_upscaling.py model_artifacts.py private_data_crypto.py pose_validation.py backup_postgres.py gpu_acceptance.py studio_db.py

      - name: Check browser JavaScript syntax
        run: node --check static/studio.js

      - name: Run CPU regression tests
        run: python -m pytest -q tests
